name: MineAssistant
description: Links Home Assistant to redstone
main: net.robiotic.mineassistant.MineAssistant
version: "1.2.0"
author: klikini
website: https://gitlab.com/klikini/mineassistant
permissions:
  hass.link:
    description: Allows linking redstone blocks to Home Assistant
    default: op
  hass.use:
    description: Allows changing the state of redstone blocks linked to Home Assistant
    default: true
commands:
  hass:
    description: Connect a redstone block to Home Assistant
    usage: /hass <entity>
    permission: hass.link
    permission-message: You don't have permission to link Home Assistant entities
load: POSTWORLD
api-version: "26.3"
